<!DOCTYPE html>
<html>

<head>
    <title>DOM Exercise</title>
</head>

<body>

<h1 id="title">Module 23 DOM Practice</h1>

<p id="message">
    Click the button below.
</p>

<button onclick="updatePage()">
    Update Page
</button>

<script>

function updatePage() {

    document.getElementById("title").innerHTML =
        "DOM Updated Successfully";

    document.getElementById("message").innerHTML =
        "The page content was updated using JavaScript.";

}

</script>

</body>

</html>
