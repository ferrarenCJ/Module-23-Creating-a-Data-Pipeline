<!DOCTYPE html>
<html>

<head>

<title>D3 Visualization Experiment</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

</head>

<body>

<h2>Simple D3 Bar Chart</h2>

<div id="chart"></div>

<script>

const data = [
    { word: "Data", count: 120 },
    { word: "Engineering", count: 90 },
    { word: "Systems", count: 75 },
    { word: "Design", count: 60 }
];

const width = 500;
const height = 300;

const svg = d3.select("#chart")
    .append("svg")
    .attr("width", width)
    .attr("height", height);

svg.selectAll("rect")
    .data(data)
    .enter()
    .append("rect")
    .attr("x", (d, i) => i * 120)
    .attr("y", d => height - d.count * 2)
    .attr("width", 80)
    .attr("height", d => d.count * 2)
    .attr("fill", "steelblue");

svg.selectAll("text")
    .data(data)
    .enter()
    .append("text")
    .text(d => d.word)
    .attr("x", (d, i) => i * 120 + 10)
    .attr("y", height - 5)
    .attr("fill", "black");

</script>

</body>

</html>
